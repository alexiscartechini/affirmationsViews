<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link rel="stylesheet" href="dist/output.css">
</head>

<body class="page-container">
  <h1>Sign In</h1>
  <form id="signinForm">
    <input class="form-primary" type="text" id="name" placeholder="Username" required><br>
    <input class="form-primary" type="email" id="emailAddress" placeholder="Email" required><br>
    <input class="form-primary" type="password" id="password" placeholder="Password" required><br>
    <input class="form-primary" type="password" id="confirmPassword" placeholder="Confirm Password" required><br>
    <button class="btn-primary" type="submit">Sign In</button>
  </form>

  <ul id="passwordCriteria" style="color: red;">
    <li id="length">At least 8 characters</li>
    <li id="uppercase">At least one uppercase letter</li>
    <li id="lowercase">At least one lowercase letter</li>
    <li id="number">At least one number</li>
    <li id="noSpace">No spaces</li>
  </ul>

  <p id="message"></p>
  <script src="signin.js"></script>
</body>
</html>
