<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="page-container">
  <h1>Login</h1>
  <form class="form-layout" id="loginForm" action="http://localhost:8080/api/auth/login" method="POST">
    <input class="form-primary" type="text" id="username" placeholder="Username" required><br>
    <input class="form-primary" type="password" id="password" placeholder="Password" required><br>
    <button class="btn-primary" type="submit">Login</button>
  </form> 
  <p id="message"></p>
  <script src="login.js"></script>
</body>
</html>
